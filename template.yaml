AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WorldMark Availability Tracker

Globals:
  Function:
    Runtime: python3.14
    Timeout: 30
    MemorySize: 256

Resources:

############################################
# DynamoDB Table
############################################

  ResortAvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResortAvailability
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resort_id
          AttributeType: S
        - AttributeName: date_room
          AttributeType: S
      KeySchema:
        - AttributeName: resort_id
          KeyType: HASH
        - AttributeName: date_room
          KeyType: RANGE


############################################
# Scrape Queue
############################################

  ScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: worldmark-scrape-queue


############################################
# Availability API Lambda
############################################

  AvailabilityApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/availability
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResortAvailabilityTable
      Events:
        GetAvailability:
          Type: Api
          Properties:
            Path: /availability
            Method: get


############################################
# Scraper Worker Lambda
############################################

  ScraperWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scraper/worker
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResortAvailabilityTable
      Events:
        ScrapeQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ScrapeQueue.Arn
            BatchSize: 5


############################################
# Scraper Controller Lambda
############################################

  ScraperControllerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scraper/controller
      Handler: handler.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScrapeQueue.QueueName
      Environment:
        Variables:
          QUEUE_URL: !Ref ScrapeQueue


############################################
# Scheduler
############################################

  ScraperSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(6 hours)
      Targets:
        - Arn: !GetAtt ScraperControllerFunction.Arn
          Id: ScraperControllerTarget


############################################
# Permission for EventBridge to invoke Lambda
############################################

  ControllerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScraperControllerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScraperSchedule.Arn