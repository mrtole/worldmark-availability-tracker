AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WorldMark Availability Tracker

Globals:
  Function:
    Timeout: 10
    Runtime: python3.14

Resources:

  ResortAvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResortAvailability
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resort_id
          AttributeType: S
        - AttributeName: date_room
          AttributeType: S
      KeySchema:
        - AttributeName: resort_id
          KeyType: HASH
        - AttributeName: date_room
          KeyType: RANGE

  AvailabilityApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/availability
      Handler: handler.lambda_handler
      Events:
        GetAvailability:
          Type: Api
          Properties:
            Path: /availability
            Method: get

  ScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: worldmark-scrape-queue
  
  ScraperWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scraper/worker
      Handler: handler.lambda_handler
      Events:
        ScrapeQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ScrapeQueue.Arn